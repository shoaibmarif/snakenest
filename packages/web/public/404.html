<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | SnakeNest Snake Game</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #090d16;
      color: #f1f5f9;
      padding: 1.5rem;
    }
    .card {
      max-width: 480px;
      text-align: center;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 0.75rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.1);
      border-radius: 9999px;
      margin-bottom: 1rem;
    }
    h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem; color: #ffffff; }
    p { font-size: 1rem; color: #9ca3af; margin-bottom: 2rem; line-height: 1.5; }
    a {
      display: inline-flex;
      align-items: center;
      padding: 0.625rem 1.25rem;
      background: #3b82f6;
      color: #ffffff;
      text-decoration: none;
      font-weight: 500;
      border-radius: 0.5rem;
      transition: background 0.2s ease;
    }
    a:hover { background: #2563eb; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">HTTP 404</div>
    <h1>Resource Not Found</h1>
    <p>The page or asset you are looking for does not exist or has been moved.</p>
    <a href="/">Back to Application</a>
  </div>
</body>
</html>
